<?xml version="1.0"?><!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- PPT → PDF 보기본 만들 때 쓰는 글꼴 규칙: 없는 한글 글꼴은 Pretendard(맑은 고딕과 비슷)로 대신 그린다 -->
<fontconfig>
  <alias><family>맑은 고딕</family><prefer><family>Pretendard</family></prefer></alias>
  <alias><family>Malgun Gothic</family><prefer><family>Pretendard</family></prefer></alias>
  <alias><family>나눔고딕</family><prefer><family>NanumGothic</family></prefer></alias>
  <alias><family>나눔명조</family><prefer><family>NanumMyeongjo</family></prefer></alias>
  <alias><family>바탕</family><prefer><family>NanumMyeongjo</family></prefer></alias>
  <alias><family>굴림</family><prefer><family>Pretendard</family></prefer></alias>
  <alias><family>돋움</family><prefer><family>Pretendard</family></prefer></alias>
  <match target="pattern"><edit name="family" mode="append"><string>Pretendard</string></edit></match>
  <selectfont><rejectfont>
    <glob>/usr/share/fonts/truetype/wqy/*</glob>
    <glob>/usr/share/fonts/opentype/unifont/*</glob>
  </rejectfont></selectfont>
</fontconfig>
