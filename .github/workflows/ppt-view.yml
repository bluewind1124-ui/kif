# PPT·엑셀·워드 자료 → PDF 보기본 + 첫 장 그림 자동 만들기 (v1.1 · 2026-11-09)
# 관리자가 포털에서 자료를 올리면(content.json이 바뀌면) 몇 분 안에 저절로 실행된다.
# PPT·엑셀·워드는 크기와 관계없이 같은 이름의 PDF 보기본을 만들어 화면에서 바로 PDF로 보이게 한다(원본은 내려받기).
name: PPT 보기본 자동 만들기

on:
  push:
    branches: [main]
    paths:
      - content.json
      - .github/ppt-view/**
      - .github/workflows/ppt-view.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ppt-view
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 할 일이 있는지 먼저 확인
        id: chk
        run: |
          python3 .github/ppt-view/make_views.py --check | tee chk.txt
          if grep -q 'todo=1' chk.txt; then echo "todo=1" >> "$GITHUB_OUTPUT"; else echo "todo=0" >> "$GITHUB_OUTPUT"; fi

      - name: 변환 프로그램·한글 글꼴 설치
        if: steps.chk.outputs.todo == '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-impress libreoffice-writer libreoffice-calc poppler-utils fonts-nanum fonts-noto-cjk fonts-croscore fonts-liberation2 >/dev/null
          sudo apt-get install -y -qq eot2ttf >/dev/null 2>&1 || echo "eot2ttf 없음(압축된 포함 글꼴은 같은 계열 글꼴로 대신)"
          pip install --quiet fonttools
          mkdir -p ~/.fonts/pretendard ~/.config/fontconfig
          cd /tmp && npm pack pretendard@1.3.9 --silent && tar xzf pretendard-1.3.9.tgz && cp package/dist/public/static/Pretendard-*.otf ~/.fonts/pretendard/
          cp "$GITHUB_WORKSPACE/.github/ppt-view/fonts.conf" ~/.config/fontconfig/fonts.conf
          fc-cache -f >/dev/null

      - name: PDF 보기본·첫 장 그림 만들기
        if: steps.chk.outputs.todo == '1'
        env:
          KIF_RESULT: /tmp/kif_views_result.json
        run: python3 .github/ppt-view/make_views.py

      - name: 저장 (포털 저장과 겹치면 최신 내용에 다시 적어 최대 5번 재시도)
        if: steps.chk.outputs.todo == '1'
        run: |
          git config user.name "kif-ppt-view"
          git config user.email "kif-ppt-view@users.noreply.github.com"
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard files news)" ]; then echo "바뀐 것 없음"; exit 0; fi
          mkdir -p /tmp/made
          python3 - <<'EOF'
          import json, shutil, os
          r = json.load(open('/tmp/kif_views_result.json', encoding='utf-8'))
          for p in list(r['views'].values()) + list(r['thumbs'].values()):
              d = os.path.join('/tmp/made', p); os.makedirs(os.path.dirname(d), exist_ok=True); shutil.copy(p, d)
          EOF
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp -r /tmp/made/. .
            python3 .github/ppt-view/make_views.py --apply /tmp/kif_views_result.json
            git add -A files news content.json
            if git diff --cached --quiet; then echo "이미 반영됨"; exit 0; fi
            git commit -q -m "PPT 보기본 자동 만들기: PDF 보기본·첫 장 그림"
            if git push -q origin HEAD:main; then echo "저장 완료"; exit 0; fi
            echo "저장이 겹쳐 다시 시도 ($i)"; sleep $((i*5))
          done
          exit 1
