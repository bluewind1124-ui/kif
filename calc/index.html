<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>금융계산기 · 한국보험금융</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--surface:#fff;--surface-2:#f8f9fc;--ink:#14213a;--muted:#5d6b82;--line:#dbe1ea;--line-2:#b9c3d3;
  --navy:#0f2240;--navy-2:#1d3557;--gold:#cb9c3a;--gold-ink:#8f6510;--gold-soft:#f8efd9;--good:#0f7a48;--bad:#b3261e;--soft:#e8edf5;
  --shadow:0 1px 2px rgba(15,34,64,.06),0 6px 20px -12px rgba(15,34,64,.28)}
:root[data-theme="dark"]{--bg:#0a1429;--surface:#112140;--surface-2:#16294d;--ink:#e8edf5;--muted:#9fb0c8;--line:#243a60;--line-2:#34507e;
  --navy:#081530;--navy-2:#1d3557;--gold:#e0b862;--gold-ink:#e0b862;--gold-soft:#3a2f17;--good:#48c78e;--bad:#ff8a80;--soft:#18305a;--shadow:0 10px 28px -14px rgba(0,0,0,.6)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
.top{background:var(--navy);color:#fff;border-bottom:3px solid var(--gold);padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top b{font-size:17px}.top span{opacity:.75;font-size:13px}
.top a{margin-left:auto;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.4);padding:4px 10px;border-radius:4px;font-size:13px}
.embed .top{display:none}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 40px}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;border-radius:8px;padding:20px 22px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border:18px solid rgba(203,156,58,.22);border-radius:50%}
.hero small{color:var(--gold);letter-spacing:.14em;font-weight:700;font-size:12px}
.hero h1{margin:2px 0 4px;font-size:24px}
.hero p{margin:0 0 12px;opacity:.85;font-size:14px}
.srch{display:flex;gap:8px;max-width:560px;position:relative;z-index:1}
.srch input{flex:1;padding:11px 14px;border-radius:6px;border:2px solid var(--gold);background:#fff;color:#14213a;min-width:0}
.cnt{margin-top:10px;font-size:13px;opacity:.85;position:relative;z-index:1}
.cnt b{color:var(--gold)}
.sits{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 8px}
.sits button,.cats button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.sits button.on,.cats button.on{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .sits button.on,:root[data-theme="dark"] .cats button.on{background:var(--gold);color:#14213a;border-color:var(--gold)}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.cats button em{font-style:normal;opacity:.6;margin-left:3px;font-size:12px}
.sec{margin:18px 0 8px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:16px;background:var(--gold);border-radius:2px}
.sec span{color:var(--muted);font-weight:400;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 14px 12px;text-align:left;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-height:118px;transition:border-color .12s,transform .12s}
.card:hover{border-color:var(--gold);transform:translateY(-1px)}
.card .ci{width:34px;height:34px;border-radius:8px;background:var(--soft);display:grid;place-items:center;color:var(--navy-2)}
:root[data-theme="dark"] .card .ci{color:var(--gold)}
.card .ci svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card b{font-size:15px}
.card p{margin:0;color:var(--muted);font-size:13px}
.card .tag{position:absolute;top:12px;right:40px;font-size:11px;color:var(--gold-ink);background:var(--gold-soft);padding:1px 7px;border-radius:999px}
.star{position:absolute;top:8px;right:8px;border:0;background:none;font-size:18px;cursor:pointer;color:var(--line-2);padding:2px 4px}
.star.on{color:var(--gold)}
.empty{color:var(--muted);padding:30px;text-align:center;background:var(--surface);border-radius:8px;border:1px dashed var(--line-2)}
/* 계산 화면 */
.calc{display:none}
.show-calc .list{display:none}.show-calc .calc{display:block}
.chd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.back{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer}
.chd h2{margin:0;font-size:21px}
.chd .basis{font-size:12px;color:var(--muted);border:1px solid var(--line-2);padding:1px 8px;border-radius:999px}
.chd .cg{font-size:12px;color:var(--gold-ink);background:var(--gold-soft);padding:2px 8px;border-radius:999px}
.desc{color:var(--muted);margin:-4px 0 12px;font-size:14px}
.cbody{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:14px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 10px;font-size:15px}
.f{margin-bottom:11px}
.f label{display:block;font-size:13px;font-weight:500;margin-bottom:4px}
.f .iw{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:6px;background:var(--surface-2);overflow:hidden}
.f .iw:focus-within{border-color:var(--gold);box-shadow:0 0 0 2px rgba(203,156,58,.25)}
.f input,.f select{flex:1;border:0;background:transparent;padding:9px 10px;min-width:0;outline:none;font-size:15px;text-align:right}
.f select{text-align:left}
.f .u{padding:0 10px;color:var(--muted);font-size:13px;white-space:nowrap}
.f .rd{font-size:12px;color:var(--gold-ink);margin-top:2px;min-height:16px;text-align:right}
.f .hl{font-size:12px;color:var(--muted);margin-top:2px}
.f.chk label{display:flex;gap:8px;align-items:center;font-weight:400;cursor:pointer}
.big{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;border-radius:8px;padding:16px 18px;margin-bottom:12px}
.big span{font-size:13px;opacity:.8}
.big b{display:block;font-size:28px;color:var(--gold);line-height:1.25;margin:2px 0;word-break:keep-all}
.big em{font-style:normal;font-size:13px;opacity:.85}
.rows{width:100%;border-collapse:collapse;font-size:14px}
.rows td{padding:8px 4px;border-bottom:1px solid var(--line)}
.rows td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.rows tr.sub td{color:var(--muted);font-size:13px;padding-left:14px}
.rows tr.sub td:last-child{font-weight:500}
.rows tr.tot td{border-top:2px solid var(--navy-2);font-size:15px}
.rows tr.minus td:last-child{color:var(--bad)}
.rows tr.plus td:last-child{color:var(--good)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.tbl th{background:var(--navy-2);color:#fff;font-weight:500;padding:6px;text-align:center}
.tbl td{padding:6px;border-bottom:1px solid var(--line);text-align:right}
.tbl td:first-child{text-align:center}
.tbl tr.hi td{background:var(--gold-soft);font-weight:700}
.bars{margin-top:12px}
.bar{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;font-size:13px;margin-bottom:6px}
.bar i{display:block;height:12px;border-radius:3px;background:var(--navy-2)}
:root[data-theme="dark"] .bar i{background:#4f86c6}
.bar i.g{background:var(--gold)}
.bar span:first-child{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.say{margin-top:12px;background:var(--gold-soft);border-left:4px solid var(--gold);padding:10px 12px;border-radius:4px;font-size:14px}
.say b{color:var(--gold-ink)}
.note{margin-top:10px;color:var(--muted);font-size:12px;line-height:1.6}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:6px;padding:8px 14px;cursor:pointer;font-size:14px}
.btn.gh{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:6px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.foot{margin-top:24px;color:var(--muted);font-size:12px;text-align:center}
.adm .due{background:#fdecea;border:1px solid #f1b5ae;color:#8a1c12;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:14px}
:root[data-theme="dark"] .adm .due{background:#3b1714;border-color:#7a2a22;color:#ffb4a9}
.embed .adm>.chd,.embed .adm>.desc{display:none}
.adm .ok{background:var(--gold-soft);border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.adm .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.adm .grp{margin-bottom:14px}
.adm .sc{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 14px}
.adm .f.chg .iw{border-color:var(--gold);background:var(--gold-soft)}
.adm .f .was{font-size:11px;color:var(--gold-ink);text-align:right;min-height:15px}
.adm table.ed{border-collapse:collapse;font-size:13px;margin:4px 0 6px;width:100%;max-width:520px}
.adm table.ed th{background:var(--navy-2);color:#fff;font-weight:500;padding:5px}
.adm table.ed td{padding:3px 4px;border-bottom:1px solid var(--line)}
.adm table.ed input{width:100%;border:1px solid var(--line-2);border-radius:4px;padding:5px 6px;background:var(--surface-2);text-align:right}
.adm table.ed input.chg{border-color:var(--gold);background:var(--gold-soft)}
.adm table.ed button{border:0;background:none;color:var(--bad);cursor:pointer;font-size:15px}
.adm .tl{font-size:13px;font-weight:700;margin-top:8px}
.adm .bar2{position:sticky;bottom:0;background:var(--surface);border-top:2px solid var(--gold);padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-radius:6px 6px 0 0;box-shadow:0 -6px 18px -12px rgba(0,0,0,.4)}
.adm .bar2 .msg{font-size:13px;color:var(--muted);flex:1 1 100%}
@media (max-width:860px){.cbody{grid-template-columns:minmax(0,1fr)}.rows td:last-child{white-space:normal;word-break:keep-all}.tbl{font-size:12px}.tbl td,.tbl th{padding:5px 3px}.hero h1{font-size:20px}.big b{font-size:24px}.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.card{min-height:108px;padding:12px}.card p{font-size:12px}.card .tag{display:none}.bar{grid-template-columns:84px 1fr auto}}
@media print{.top,.list,.back,.acts,.hero,.sits,.cats,.foot{display:none!important}body{background:#fff}.panel,.big{box-shadow:none;break-inside:avoid}.cbody{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<script>
(function(){
'use strict';
var root=document.documentElement;
var EMB=/[?&]embed=1/.test(location.search);
if(EMB)document.body.classList.add('embed');
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
/* 테마: 포털과 같은 저장값(kif_theme)을 따른다 */
(function(){var t=lsGet('kif_theme');
  try{if(window.parent!==window){var pt=parent.document.documentElement.getAttribute('data-theme');if(pt)t=pt;}}catch(e){}
  if(!t&&window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)t='dark';

/* ---------- 숫자 표시 ---------- */
function r0(x){return Math.round(x);}
function com(x){x=Math.round(x);return (x<0?'-':'')+String(Math.abs(x)).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
/* 만원 단위 값을 "3억 2,500만원"으로 */
function man(x){if(!isFinite(x))return '-';var neg=x<0;x=Math.abs(x);var s;
  if(x<1&&x>0)s=com(x*10000)+'원';
  else{x=Math.round(x);var e=Math.floor(x/10000),m=x%10000;s=(e?com(e)+'억'+(m?' ':''):'')+(m||!e?com(m)+'만':'')+'원';}
  return (neg?'-':'')+s;}
function won(x){return com(x)+'원';}
function pct(x,d){return (isFinite(x)?x.toFixed(d==null?1:d):'-')+'%';}
function yrs(x){return isFinite(x)?(Math.round(x*10)/10)+'년':'-';}

/* ---------- 재무 함수 ---------- */
function fvLump(pv,r,n){return pv*Math.pow(1+r,n);}
function fvAnn(p,r,n){return r===0?p*n:p*(Math.pow(1+r,n)-1)/r;}          /* 기말 적립 */
function pvAnn(p,r,n){return r===0?p*n:p*(1-Math.pow(1+r,-n))/r;}
function pmtFor(pv,r,n){return r===0?pv/n:pv*r/(1-Math.pow(1+r,-n));}
function mr(y){return Math.pow(1+y/100,1/12)-1;}                           /* 연 → 월 실효 */
/* ---------- 법령 기준값 ----------
   세율·공제 한도·기준금액은 모두 아래 RULES 한 곳에 모여 있다.
   관리자가 포털 「관리자 › 계산기 기준값」에서 고쳐 저장하면 content.json의 calcRules{at,basis,by,v}에 들어가고,
   계산기는 열릴 때 그것을 읽어 기본값을 덮어쓴다. 표(t)는 [구간 상한(만원, 마지막은 null), 세율%] 목록이다. */
var RULES=[
  {g:'종합소득세',items:[['inc','종합소득세 세율표','t',[[1400,6],[5000,15],[8800,24],[15000,35],[30000,38],[50000,40],[100000,42],[null,45]],'과세표준 구간 상한(만원) · 세율(%)'],
    ['local','지방소득세 (소득세·법인세 대비)','%',10]]},
  {g:'상속세 · 증여세',items:[['inh','상속·증여세 세율표','t',[[10000,10],[50000,20],[100000,30],[300000,40],[null,50]],'과세표준 구간 상한(만원) · 세율(%)'],
    ['filing','신고세액공제','%',3],['lump','상속 일괄공제','만원',50000],['basic','상속 기초공제','만원',20000],['child','상속 자녀공제 (1인당)','만원',5000],
    ['spMin','배우자 상속공제 최소','만원',50000],['spMax','배우자 상속공제 최대','만원',300000],['finAll','금융재산공제: 전액 공제 기준','만원',2000],['finRate','금융재산공제 비율','%',20],['finMax','금융재산공제 한도','만원',20000],
    ['funMin','장례비 최소 인정','만원',500],['funMax','장례비 최대 인정 (봉안 포함)','만원',1500],
    ['gSp','증여공제: 배우자','만원',60000],['gAd','증여공제: 성년 자녀','만원',5000],['gMi','증여공제: 미성년 자녀','만원',2000],['gPa','증여공제: 부모 (직계존속)','만원',5000],['gKin','증여공제: 기타 친족','만원',1000],
    ['gWed','혼인·출산 증여공제 한도','만원',10000],['skip','세대생략 할증','%',30],['skip2','세대생략 할증 (미성년·20억 초과)','%',40],['skipBig','세대생략 40% 기준 금액','만원',200000]]},
  {g:'연금 · 퇴직',items:[['psLim','연금저축 세액공제 한도','만원',600],['pnLim','연금저축+IRP 합계 한도','만원',900],['crLo','세액공제율 (소득 기준 이하, 지방세 포함)','%',16.5],['crHi','세액공제율 (기준 초과, 지방세 포함)','%',13.2],
    ['bandW','공제율 기준: 총급여','만원',5500],['bandI','공제율 기준: 종합소득','만원',4500],['isaR','ISA 이전 추가 공제 비율','%',10],['isaMax','ISA 이전 추가 공제 한도','만원',300],
    ['npsE','국민연금 조기 수령 감액 (1년당)','%',6],['npsL','국민연금 연기 수령 증액 (1년당)','%',7.2],['npsMax','조기·연기 최대 기간','년',5],
    ['svc','퇴직소득 근속연수공제 (1년당 공제액)','t',[[5,100],[10,200],[20,250],[null,300]],'근속 연수 구간 상한(년) · 1년당 공제액(만원)'],
    ['conv','퇴직소득 환산급여공제 (공제율)','t',[[800,100],[7000,60],[10000,55],[30000,45],[null,35]],'환산급여 구간 상한(만원) · 공제율(%)'],

function prog(base,T){var t=0,lo=0;if(base<=0)return 0;for(var i=0;i<T.length;i++){var hi=T[i][0]==null?Infinity:T[i][0];if(base>lo)t+=(Math.min(base,hi)-lo)*T[i][1]/100;lo=hi;if(base<=hi)break;}return t;}
function topRate(base,T){for(var i=0;i<T.length;i++)if(T[i][0]==null||base<=T[i][0])return T[i][1]/100;return 0;}
function bandIdx(base,T){for(var i=0;i<T.length;i++)if(T[i][0]==null||base<=T[i][0])return i;return T.length-1;}
function tblRows(T,withQ){var lo=0;return T.map(function(r,i){var q=prog(lo,T)-lo*r[1]/100,row=[(r[0]==null?man(lo)+' 초과':man(r[0])+' 이하'),r[1]+'%'];if(withQ)row.push(i?man(-q):'-');lo=r[0]==null?lo:r[0];return row;});}
function L(){return 1+P.local/100;}
function rateList(T){return T.map(function(r){return r[1];}).join('·')+'%';}

  d:'가구 소득에 비해 보장성 보험료가 적정한지 보고, 더 넣을 여력이 얼마나 남았는지 보여 줍니다.',
  f:[['inc','가구 월 소득 (세후)','만원',600],['cur','지금 내는 보장성 보험료 (월)','만원',50,'연금·저축보험 제외'],['lo','권장 비율 하한','%',7],['hi','권장 비율 상한','%',10,'흔히 소득의 7~10%']],

      bars:[['지금 보험료',v.cur],['권장 하한',lo,null,'g'],['권장 상한',hi,null,'g']],

      note:'권장 비율은 업계에서 흔히 쓰는 기준이며 고객 상황(부채·자녀 수)에 따라 달라집니다.'};}});

add({id:'termwl',cat:'cover',ic:'swap',name:'정기 vs 종신 비교 계산기',kw:'정기보험 종신보험 차액 투자 해지환급금 비교',
  d:'같은 사망보장을 정기보험으로 들고 보험료 차이를 따로 모았을 때와 종신보험을 비교합니다.',
  f:[['wl','종신보험 월 보험료','만원',30],['tm','정기보험 월 보험료','만원',6],['pay','납입 기간','년',20],['at','비교 시점 (가입 후)','년',30],
     ['r','차액을 모을 때 수익률 (연)','%',3.5],['cv','비교 시점 종신 해지환급금','만원',8000,'가입설계서의 해지환급금 표에서 확인'],['tmEnd','정기보험 보장 끝나는 시점 (가입 후)','년',30]],
  run:function(v){var i=mr(v.r),d=v.wl-v.tm,f=fvAnn(d,i,v.pay*12);f=fvLump(f,v.r/100,Math.max(0,v.at-v.pay));

      rows:[['월 보험료 차이',man(d)],['종신 총 납입액',man(wlPaid),'sub'],['정기 총 납입액',man(v.tm*12*v.pay),'sub'],['차액을 모은 돈 ('+v.at+'년 뒤)',man(f),'plus'],['종신 해지환급금 ('+v.at+'년 뒤)',man(v.cv),'plus'],
        ['정기보험 보장',v.tmEnd>=v.at?'비교 시점에도 유지':'가입 후 '+v.tmEnd+'년에 끝남']],
      bars:[['차액 모은 돈',f],['종신 환급금',v.cv,null,'g']],
      say:v.tmEnd<v.at?'"정기보험은 '+v.tmEnd+'년 뒤 보장이 끝나지만, 종신은 <b>평생 사망보장</b>이 남습니다. 숫자만이 아니라 보장이 끝난 뒤를 같이 보셔야 합니다."':'"보험료 차이를 꾸준히 모을 수 있는지가 핵심입니다. 중간에 쓰게 되면 비교가 달라집니다."',
      note:'차액은 매달 같은 금액을 납입 기간 동안 모으고, 그 뒤엔 그대로 굴린다고 가정했습니다. 차액 투자 이익에 대한 세금은 빼지 않았습니다.'};}});

add({id:'med',cat:'cover',ic:'med',name:'의료비 부담 계산기 (실손 있을 때·없을 때)',kw:'실손 실비 자기부담 4세대 3세대 비급여 급여 통원 입원',
  d:'같은 병원비라도 실손보험이 있을 때와 없을 때 내 지갑에서 나가는 돈이 얼마나 다른지 계산합니다.',
  f:[['gen','실손 세대','',3,'고르면 자기부담 비율이 바뀝니다','sel',['1세대 (~2009.9)','2세대 (2009.10~2017.3)','3세대 (2017.4~2021.6)','4세대 (2021.7~)']],
     ['cov','급여 본인부담금','만원',200,'영수증의 「급여 본인부담」 합계'],['non','비급여 금액','만원',300],
     ['p1','급여 자기부담 비율','%',20],['p2','비급여 자기부담 비율','%',30],['visits','통원 횟수','회',0,'입원만이면 0'],['ded','통원 1회 최소 공제','만원',3]],

  run:function(v){var no=v.cov+v.non,a=v.cov*v.p1/100,b=v.non*v.p2/100,share=a+b,minD=v.visits*v.ded;if(v.visits>0)share=Math.max(share,Math.min(no,minD));
    share=Math.min(share,no);var back=no-share;
    return {big:['실손이 있으면 내 부담',man(share),'실손이 없으면 '+man(no)+' → '+man(back)+' 돌려받음'],
      rows:[['병원비 합계',man(no)],['급여 자기부담',man(a),'sub'],['비급여 자기부담',man(b),'sub'],v.visits?['통원 최소 공제 ('+v.visits+'회)',man(minD),'sub']:null,['실손 있을 때 내 부담',man(share),'tot'],['실손이 돌려주는 돈',man(back),'tot plus']].filter(Boolean),
      bars:[['실손 없을 때',no],['실손 있을 때',share,null,'g']],
      say:'"같은 병원비 '+man(no)+'도 실손이 있으면 <b>'+man(share)+'</b>만 부담합니다."',
      note:'세대별 비율은 대표적인 예입니다(선택형·표준형, 상품마다 다름). 4세대 도수·주사 등 비급여 특약 한도, 연간 자기부담 상한, 비급여 이용량에 따른 보험료 할증은 반영하지 않았습니다.'};}});

add({id:'refund',cat:'cover',ic:'pct',name:'환급률·연환산 수익률 계산기',kw:'단기납 종신 환급률 해지환급금 수익률 IRR 저축보험',
  d:'낸 보험료 대비 해지환급금 비율(환급률)과, 이를 예금처럼 연 몇 % 복리로 굴린 것과 같은지 계산합니다.',
  f:[['p','월 보험료','만원',100],['pay','납입 기간','년',5],['at','환급 시점 (가입 후)','년',10],['cv','그 시점 해지환급금','만원',7000,'가입설계서 해지환급금 표']],
  run:function(v){var paid=v.p*12*v.pay,rate=v.cv/paid*100,n=v.pay*12,T=v.at*12;
    function f(i){var s=0;for(var k=0;k<n;k++)s+=v.p*Math.pow(1+i,T-k);return s;}
    var lo=-0.05,hi=0.05;for(var it=0;it<80;it++){var m=(lo+hi)/2;if(f(m)>v.cv)hi=m;else lo=m;}
    var irr=(Math.pow(1+lo,12)-1)*100;
    return {big:['환급률 '+pct(rate),'연 '+pct(irr,2)+' 복리와 같음','총 납입 '+man(paid)+' → 환급 '+man(v.cv)],
      rows:[['총 납입 보험료',man(paid)],['해지환급금',man(v.cv)],['차이 (이익)',man(v.cv-paid),v.cv>=paid?'plus':'minus'],['환급률',pct(rate),'tot'],['연환산 복리 수익률',pct(irr,2),'tot'],
        ['같은 수익을 내려면 필요한 예금 금리 (이자소득세 '+pct(P.finW*L(),1)+' 감안)',pct(irr/(1-P.finW*L()/100),2),'sub']],
      say:'"매달 '+man(v.p)+'씩 '+v.pay+'년 넣고 '+v.at+'년 뒤에 찾으면, 예금으로 치면 세전 연 <b>'+pct(irr/(1-P.finW*L()/100),2)+'</b> 상품과 비슷합니다."',
      note:'보험은 사망보장 비용이 포함돼 있어 단순 금융상품 비교와는 다릅니다. 저축성보험 비과세 요건(월납 5년 이상 납입·10년 유지, 한도 등) 충족 여부를 확인하세요.'};}});

add({id:'renew',cat:'cover',ic:'renew',name:'갱신형 보험료 증가 계산기',kw:'갱신형 비갱신형 보험료 인상 총납입',
  d:'갱신할 때마다 보험료가 오르면 끝까지 총 얼마를 내는지, 비갱신형과 비교합니다.',
  f:[['p','지금 월 보험료 (갱신형)','만원',5],['cyc','갱신 주기','년',10],['up','갱신 때 인상률','%',30,'과거 인상 이력·나이를 보고 넣으세요'],['yrs','보장 받을 기간','년',40],
     ['np','비갱신형 월 보험료','만원',9],['npay','비갱신형 납입 기간','년',20]],

      rows:[['갱신형 총 납입',man(tot)],['갱신형 마지막 월 보험료',man(p/(1+v.up/100))],['비갱신형 총 납입',man(nt)],['차이',man(tot-nt),'tot '+(tot>nt?'minus':'plus')]],
      tbl:{h:['구간','월 보험료','누적 납입'],r:T},
      bars:[['갱신형',tot],['비갱신형',nt,null,'g']],
      say:'"지금은 월 '+man(v.p)+'로 싸 보여도, '+v.cyc+'년마다 '+v.up+'%씩 오르면 마지막엔 월 <b>'+man(p/(1+v.up/100))+'</b>입니다. 소득이 줄어드는 노후에 보험료가 가장 비쌉니다."'};}});

add({id:'retire',cat:'retire',ic:'sun',name:'은퇴자금 계산기',kw:'노후 은퇴 노후자금 필요자금 월저축 국민연금',
  d:'원하는 노후 생활비를 기대수명까지 쓰려면 은퇴 때 얼마가 있어야 하고, 지금부터 매달 얼마를 모아야 하는지 계산합니다.',
  f:[['age','현재 나이','세',45],['ra','은퇴 나이','세',60],['life','기대 수명','세',90],['exp','은퇴 후 월 생활비 (지금 돈 가치)','만원',300],
     ['np','국민연금 예상 월액 (지금 돈 가치)','만원',100,'국민연금공단 「내 곁에 국민연금」에서 확인'],['npa','국민연금 받기 시작하는 나이','세',65],
     ['have','지금 노후용으로 모은 돈','만원',5000],['inf','물가상승률','%',2.5],['r1','은퇴 전 수익률','%',4],['r2','은퇴 후 수익률','%',3]],
  run:function(v){var n=v.ra-v.age,need=0,T=[];
    for(var a=v.ra;a<v.life;a++){var g=Math.pow(1+v.inf/100,a-v.age),yr=(v.exp-(a>=v.npa?v.np:0))*12*g;need+=Math.max(yr,0)/Math.pow(1+v.r2/100,a-v.ra);}
    var haveF=fvLump(v.have,v.r1/100,n),gap=Math.max(need-haveF,0),i=mr(v.r1),pm=n>0?gap*i/(Math.pow(1+i,n*12)-1):gap;
    return {big:['매달 모아야 할 금액',man(pm),v.ra+'세까지 '+man(need)+' 필요'],
      rows:[['은퇴 때 필요한 목돈',man(need)],['지금 모은 돈이 은퇴 때 불어난 금액',man(haveF),'minus'],['더 모아야 할 목돈',man(gap),'tot'],['은퇴까지 남은 기간',n+'년'],['매달 저축할 금액',man(pm),'tot'],
        ['은퇴 첫해 월 생활비 (물가 반영)',man(v.exp*Math.pow(1+v.inf/100,n)),'sub']],
      bars:[['필요 목돈',need],['준비된 돈',haveF,null,'g']],
      say:'"'+v.ra+'세부터 '+v.life+'세까지 지금 돈으로 월 '+man(v.exp)+'씩 쓰려면, 은퇴 때 <b>'+man(need)+'</b>이 있어야 합니다. 지금부터 매달 <b>'+man(pm)+'</b>씩 모으면 됩니다."',
      note:'국민연금은 물가만큼 오른다고 보고, 생활비에서 빼서 계산했습니다. 세금과 의료비 급증은 반영하지 않았습니다.'};}});

add({id:'annuity',cat:'retire',ic:'coin',name:'연금 수령액 계산기',kw:'연금 월수령 적립금 연금전환 확정기간',
  d:'모아 둔 적립금을 정한 기간 동안 나눠 받으면 매달 얼마씩 받는지 계산합니다.',

add({id:'draw',cat:'retire',ic:'hour',name:'노후자금 인출 기간 계산기',kw:'인출 고갈 몇살까지 은퇴자산 생활비',
  d:'가진 노후자금에서 매달 생활비를 빼 쓰면 몇 살까지 버틸 수 있는지 계산합니다.',
  f:[['age','지금 나이','세',60],['amt','노후자금','만원',50000],['out','매달 꺼내 쓰는 돈','만원',250],['inf','꺼내 쓰는 돈 증가율 (물가)','%',2],['r','남은 돈 수익률 (연)','%',3]],
  run:function(v){var b=v.amt,m=0,out=v.out,i=mr(v.r),T=[];while(b>0&&m<1200){b=b*(1+i)-out;m++;if(m%12===0){out*=1+v.inf/100;if(m%60===0)T.push([(v.age+m/12)+'세',man(Math.max(b,0))]);}}
    var y=m/12;return {big:[m>=1200?'100년 넘게 버팁니다':'돈이 바닥나는 나이',m>=1200?'평생':Math.floor(v.age+y)+'세',m>=1200?'':'약 '+yrs(y)+' 동안 쓸 수 있음'],

add({id:'irp',cat:'retire',ic:'gift',name:'연금저축·IRP 세액공제 계산기',kw:'연금저축 IRP 세액공제 연말정산 13월의월급 ISA 900만원',

add({id:'nps',cat:'retire',ic:'cal',name:'국민연금 수령 시기 비교 계산기',kw:'국민연금 조기수령 연기수령 손익분기',

  f:[['m','정상 수령 시 월 연금액','만원',120],['age','정상 수령 시작 나이','세',65,'1969년생 이후 65세'],['e','조기 수령 (몇 년 당겨서)','년',function(){return P.npsMax;},function(){return '1년당 '+P.npsE+'% 감액, 최대 '+P.npsMax+'년';}],['l','연기 수령 (몇 년 늦춰서)','년',function(){return P.npsMax;},function(){return '1년당 '+P.npsL+'% 증액, 최대 '+P.npsMax+'년';}]],
  run:function(v){var e=Math.min(Math.max(v.e,0),P.npsMax),l=Math.min(Math.max(v.l,0),P.npsMax),A=[[v.age-e,v.m*(1-P.npsE/100*e),'조기'],[v.age,v.m,'정상'],[v.age+l,v.m*(1+P.npsL/100*l),'연기']];

add({id:'crevasse',cat:'retire',ic:'gap',name:'은퇴 크레바스 계산기',kw:'은퇴크레바스 소득공백 퇴직 연금개시 브릿지',

add({id:'sevtax',cat:'retire',ic:'scale',name:'퇴직소득세 · 일시금 vs 연금 계산기',kw:'퇴직소득세 일시금 연금수령 IRP 감면',
  d:'퇴직금을 한 번에 받을 때 내는 퇴직소득세와, IRP에 넣어 연금으로 받을 때 줄어드는 세금을 비교합니다.',

add({id:'inh',cat:'tax',ic:'house',name:'상속세 계산기',kw:'상속세 상속 배우자공제 일괄공제 종신보험 재원',

/* ---------- 상황 찾기 ---------- */
var SITS=[['상속을 준비해요',['inh','gift','death','stock']],['노후가 걱정돼요',['retire','pillar','nps','crevasse','draw','annuity']],['퇴직을 앞두고 있어요',['sev','sevtax','crevasse','irp']],
  ['보장을 점검해요',['death','ci','ltc','fit','med','kid']],['보험을 비교해요',['refund','termwl','renew']],['목돈을 모으고 싶어요',['goal','fv','comp','opp']],
  ['연말정산·세금',['irp','inc','fin','four']],['법인 대표 상담',['keyman','loanint','exec','stock','corp']]];

/* ---------- 초성 검색 ---------- */
var CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
function cho(s){var o='';for(var i=0;i<s.length;i++){var c=s.charCodeAt(i)-44032;o+=(c>=0&&c<11172)?CHO[Math.floor(c/588)]:s[i];}return o;}
function isCho(q){return /^[ㄱ-ㅎ\s]+$/.test(q);}
C.forEach(function(c){c._t=(c.name+' '+c.kw+' '+c.d).toLowerCase();c._c=cho((c.name+' '+c.kw).replace(/\s/g,''));});

/* ---------- 상태 ---------- */
var st={q:'',cat:'all',sit:-1};
function favs(){try{return JSON.parse(lsGet('kif_calc_fav')||'[]');}catch(e){return [];}}
function recent(){try{return JSON.parse(lsGet('kif_calc_recent')||'[]');}catch(e){return [];}}
function byId(id){for(var i=0;i<C.length;i++)if(C[i].id===id)return C[i];return null;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function catName(k){for(var i=0;i<CATS.length;i++)if(CATS[i][0]===k)return CATS[i][1];return '';}

function card(c){var on=favs().indexOf(c.id)>-1;
  return '<div class="card" role="button" tabindex="0" data-open="'+c.id+'"><span class="ci">'+svg(c.ic)+'</span><span class="tag">'+catName(c.cat)+'</span>'+
    '<button class="star'+(on?' on':'')+'" data-fav="'+c.id+'" aria-label="즐겨찾기">'+(on?'★':'☆')+'</button><b>'+esc(c.name)+'</b><p>'+esc(c.d)+'</p></div>';}

function renderList(){
  var q=st.q.trim().toLowerCase(),list=C.filter(function(c){
    if(st.cat!=='all'&&st.cat!=='fav'&&c.cat!==st.cat)return false;
    if(st.cat==='fav'&&favs().indexOf(c.id)<0)return false;
    if(st.sit>-1&&SITS[st.sit][1].indexOf(c.id)<0)return false;
    if(!q)return true;
    if(isCho(q))return c._c.indexOf(q.replace(/\s/g,''))>-1;
    return q.split(/\s+/).every(function(w){return c._t.indexOf(w)>-1;});});
  if(st.sit>-1)list.sort(function(a,b){return SITS[st.sit][1].indexOf(a.id)-SITS[st.sit][1].indexOf(b.id);});
  document.getElementById('cnt').innerHTML='계산기 <b>'+C.length+'개</b> · '+CATS.map(function(k){return k[1]+' '+C.filter(function(c){return c.cat===k[0];}).length;}).join(' · ')+'<br>세율·공제 기준: <b>'+esc(basisText())+'</b>';
  document.getElementById('sits').innerHTML=SITS.map(function(s,i){return '<button data-sit="'+i+'" class="'+(st.sit===i?'on':'')+'">'+s[0]+'</button>';}).join('');
  var fv=favs();
  document.getElementById('cats').innerHTML=[['all','전체',C.length],['fav','★ 즐겨찾기',fv.length]].concat(CATS.map(function(k){return [k[0],k[1],C.filter(function(c){return c.cat===k[0];}).length];}))
    .map(function(k){return '<button data-cat="'+k[0]+'" class="'+(st.cat===k[0]?'on':'')+'">'+k[1]+'<em>'+k[2]+'</em></button>';}).join('');
  var h='';
  if(!q&&st.cat==='all'&&st.sit<0){var rc=recent().map(byId).filter(Boolean).slice(0,4);
    if(rc.length)h+='<div class="sec">최근 사용 <span>'+rc.length+'</span></div><div class="grid">'+rc.map(card).join('')+'</div>';
    CATS.forEach(function(k){var g=list.filter(function(c){return c.cat===k[0];});h+='<div class="sec">'+k[1]+' <span>'+g.length+'개</span></div><div class="grid">'+g.map(card).join('')+'</div>';});}
  else h=list.length?'<div class="sec">'+(st.sit>-1?SITS[st.sit][0]:q?'"'+esc(st.q)+'" 찾은 결과':st.cat==='fav'?'즐겨찾기':catName(st.cat))+' <span>'+list.length+'개</span></div><div class="grid">'+list.map(card).join('')+'</div>'
    :'<div class="empty">'+(st.cat==='fav'?'카드 오른쪽 위 ☆를 누르면 즐겨찾기에 담깁니다.':'찾는 계산기가 없습니다. 다른 낱말이나 초성으로 찾아 보세요.')+'</div>';
  document.getElementById('lists').innerHTML=h;
}

/* ---------- 계산 화면 ---------- */
var cur=null,vals={};
function unitRead(u,x){return u==='만원'&&isFinite(x)&&x!==0?man(x):'';}
function fval(x){return typeof x==='function'?x():x;}
function openCalc(id,push){var c=byId(id);if(!c)return;cur=c;vals={};
  /* 기준값(RULES)에 따라 바뀌는 이름·기본값·도움말을 지금 기준으로 풀어 둔다 */
  c.F=c.f.map(function(f){return f.map(function(x,i){return (i===1||i===3||i===4||i===6)?fval(x):x;});});
  c.F.forEach(function(f){vals[f[0]]=f[3];});
  var saved;try{saved=JSON.parse(lsGet('kif_calc_v_'+id)||'null');}catch(e){}
  /* 기준값이 바뀐 뒤에는 기준값에서 온 칸(요율 등)은 예전에 넣은 값 대신 새 기준값을 쓴다 */
  if(saved){var sv=saved.v||saved,same=saved.at===META.at;c.f.forEach(function(f){var k=f[0];if(!(k in sv))return;if(!same&&typeof f[3]==='function')return;vals[k]=sv[k];});}
  var rc=recent().filter(function(x){return x!==id;});rc.unshift(id);lsSet('kif_calc_recent',JSON.stringify(rc.slice(0,8)));
  var h='<div class="chd"><button class="back" data-back="1">← 계산기 목록</button><h2>'+esc(c.name)+'</h2><span class="cg">'+catName(c.cat)+'</span>'+(c.cat==='tax'||c.cat==='corp'||c.id==='irp'||c.id==='nps'||c.id==='sevtax'||c.id==='four'?'<span class="basis">'+basisText()+'</span>':'')+'</div><p class="desc">'+esc(c.d)+'</p>'+
    '<div class="cbody"><div class="panel"><h3>입력</h3><div id="fs">'+c.F.map(fieldHtml).join('')+'</div>'+
    '<div class="acts"><button class="btn gh" data-reset="1">처음 값으로</button></div></div><div id="res"></div></div>';
  document.getElementById('calc').innerHTML=h;document.getElementById('app').classList.add('show-calc');
  if(push!==false)try{history.pushState({c:id},'','#c='+id);}catch(e){location.hash='c='+id;}
  window.scrollTo(0,0);calc();}
function fieldHtml(f){var k=f[0],t=f[5]||'n',v=vals[k];
  if(t==='sel')return '<div class="f"><label for="i_'+k+'">'+esc(f[1])+'</label><div class="iw"><select id="i_'+k+'" data-k="'+k+'">'+f[6].map(function(o,i){return '<option value="'+i+'"'+(+v===i?' selected':'')+'>'+esc(o)+'</option>';}).join('')+'</select></div>'+(f[4]?'<div class="hl">'+esc(f[4])+'</div>':'')+'</div>';
  if(t==='chk')return '<div class="f chk"><label><input type="checkbox" data-k="'+k+'"'+(v?' checked':'')+'> '+esc(f[1])+'</label>'+(f[4]?'<div class="hl">'+esc(f[4])+'</div>':'')+'</div>';
  return '<div class="f"><label for="i_'+k+'">'+esc(f[1])+'</label><div class="iw"><input id="i_'+k+'" data-k="'+k+'" type="text" inputmode="decimal" value="'+com2(v)+'"><span class="u">'+esc(f[2])+'</span></div>'+
    '<div class="rd" id="rd_'+k+'">'+unitRead(f[2],v)+'</div>'+(f[4]?'<div class="hl">'+esc(f[4])+'</div>':'')+'</div>';}
function com2(v){if(v===''||v==null)return '';var s=String(v).split('.');return s[0].replace(/\B(?=(\d{3})+(?!\d))/g,',')+(s.length>1?'.'+s[1]:'');}
function num(s){var x=parseFloat(String(s).replace(/,/g,''));return isFinite(x)?x:0;}
function calc(){var c=cur,v={};if(!c)return;
  c.F.forEach(function(f){var x=vals[f[0]];v[f[0]]=(f[5]==='sel')?+x:(f[5]==='chk')?!!x:num(x);});
  var o;try{o=c.run(v);}catch(e){o={big:['계산할 수 없습니다','-','입력값을 확인해 주세요']};}
  var mx=0;(o.bars||[]).forEach(function(b){if(b[1]>mx)mx=b[1];});
  var h='<div class="big"><span>'+esc(o.big[0])+'</span><b>'+esc(o.big[1])+'</b><em>'+esc(o.big[2]||'')+'</em></div><div class="panel"><h3>계산 결과</h3>';
  if(o.rows)h+='<table class="rows">'+o.rows.map(function(r){return '<tr class="'+(r[2]||'')+'"><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>';}).join('')+'</table>';
  if(o.bars&&mx>0)h+='<div class="bars">'+o.bars.map(function(b){return '<div class="bar"><span title="'+esc(b[0])+'">'+esc(b[0])+'</span><i class="'+(b[3]||'')+'" style="width:'+Math.max(1,b[1]/mx*100)+'%"></i><span>'+man(b[1])+'</span></div>';}).join('')+'</div>';
  if(o.tbl&&o.tbl.r&&o.tbl.r.length)h+='<table class="tbl"><thead><tr>'+o.tbl.h.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr></thead><tbody>'+o.tbl.r.map(function(r,i){return '<tr class="'+(o.tbl.hi===i?'hi':'')+'">'+r.map(function(x){return '<td>'+esc(x)+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>';
  if(o.say)h+='<div class="say"><b>상담 화법</b><br>'+o.say+'</div>';
  if(o.note)h+='<div class="note">※ '+esc(o.note)+'</div>';
  h+='<div class="note">※ 상담용 참고 계산입니다. 적용 기준: '+basisText()+'. 실제 금액은 상품 약관·가입설계서와 세무 전문가 확인이 우선합니다.</div>';
  h+='<div class="acts"><button class="btn" data-copy="1">결과 복사 (문자·카톡용)</button><button class="btn gh" data-print="1">인쇄 · PDF</button></div></div>';
  document.getElementById('res').innerHTML=h;cur._o=o;cur._v=v;
  try{lsSet('kif_calc_v_'+c.id,JSON.stringify({at:META.at,v:vals}));}catch(e){}}
function copyText(){var c=cur,o=c._o,t='['+c.name+']\n';
  c.F.forEach(function(f){var x=c._v[f[0]];t+='· '+f[1]+': '+(f[5]==='sel'?f[6][x]:f[5]==='chk'?(x?'예':'아니오'):(f[2]==='만원'?man(x):com2(x)+f[2]))+'\n';});
  t+='\n▶ '+o.big[0]+': '+o.big[1]+(o.big[2]?' ('+o.big[2]+')':'')+'\n';(o.rows||[]).forEach(function(r){t+='- '+r[0]+': '+r[1]+'\n';});
  t+='\n※ 상담용 참고 계산('+basisText()+')이며 실제 금액은 약관·세법 확인이 우선합니다.\n한국보험금융 금융계산기';
  function ok(){toast('결과를 복사했습니다');}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,function(){fb();});else fb();
  function fb(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok();}catch(e){}a.remove();}}
function toast(s){var e=document.getElementById('toast');e.textContent=s;e.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){e.classList.remove('on');},1800);}
function closeCalc(push){cur=null;document.getElementById('app').classList.remove('show-calc');if(push!==false)try{history.pushState({},'',location.pathname+location.search);}catch(e){}renderList();}

/* ---------- 이벤트 ---------- */
document.getElementById('q').addEventListener('input',function(e){st.q=e.target.value;st.sit=-1;renderList();});
document.addEventListener('click',function(e){var t=e.target,b;
  if((b=t.closest('[data-fav]'))){e.stopPropagation();var id=b.getAttribute('data-fav'),f=favs(),i=f.indexOf(id);if(i>-1)f.splice(i,1);else f.push(id);lsSet('kif_calc_fav',JSON.stringify(f));renderList();return;}
  if((b=t.closest('[data-open]'))){openCalc(b.getAttribute('data-open'));return;}
  if((b=t.closest('[data-sit]'))){var s=+b.getAttribute('data-sit');st.sit=st.sit===s?-1:s;st.cat='all';st.q='';document.getElementById('q').value='';renderList();return;}
  if((b=t.closest('[data-cat]'))){st.cat=b.getAttribute('data-cat');st.sit=-1;renderList();return;}
  if(t.closest('[data-back]')){closeCalc();return;}
  if(t.closest('[data-reset]')){try{localStorage.removeItem('kif_calc_v_'+cur.id);}catch(e){}openCalc(cur.id,false);return;}
  if(t.closest('[data-copy]')){copyText();return;}
  if(t.closest('[data-print]')){window.print();return;}});
document.addEventListener('keydown',function(e){if(e.key==='Enter'){var b=e.target.closest&&e.target.closest('[data-open]');if(b&&e.target===b)openCalc(b.getAttribute('data-open'));}});
document.getElementById('calc').addEventListener('input',function(e){var k=e.target.getAttribute('data-k');if(!k)return;
  var f=cur.F.filter(function(x){return x[0]===k;})[0];
  if(e.target.type==='checkbox')vals[k]=e.target.checked;
  else if(e.target.tagName==='SELECT'){vals[k]=+e.target.value;var p=cur.preset&&cur.preset[k]&&cur.preset[k][vals[k]];
    if(p){for(var pk in p){vals[pk]=p[pk];var el=document.getElementById('i_'+pk);if(el)el.value=com2(p[pk]);var rd=document.getElementById('rd_'+pk);if(rd){var ff=cur.F.filter(function(x){return x[0]===pk;})[0];rd.textContent=unitRead(ff[2],p[pk]);}}}}
  else{var raw=e.target.value.replace(/[^\d.\-]/g,'');vals[k]=raw;var rd2=document.getElementById('rd_'+k);if(rd2)rd2.textContent=unitRead(f[2],num(raw));}
  calc();});
document.getElementById('calc').addEventListener('change',function(e){if(e.target.tagName==='INPUT'&&e.target.type==='text'){e.target.value=com2(vals[e.target.getAttribute('data-k')]);}});
document.getElementById('calc').addEventListener('focusin',function(e){if(e.target.tagName==='INPUT'&&e.target.type==='text')e.target.value=String(vals[e.target.getAttribute('data-k')]);});
window.addEventListener('popstate',function(){var m=/c=([\w]+)/.exec(location.hash);if(m)openCalc(m[1],false);else closeCalc(false);});
/* 포털 테마가 바뀌면 따라간다 */
window.addEventListener('message',function(e){if(e.data&&e.data.kifTheme)root.setAttribute('data-theme',e.data.kifTheme);});

/* ---------- 적용 기준 표시 · 점검 시기 ---------- */
function dstr(d){return d.getFullYear()+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+('0'+d.getDate()).slice(-2);}
function atStr(){return String(META.at||'').replace(/-/g,'.');}
function basisText(){return META.basis+' · '+atStr()+' 확인';}
/* 세법·요율이 주로 바뀌는 1월 1일·7월 1일 이후에 아직 확인하지 않았으면 점검 시기 */
function lastCheckpoint(){var t=new Date(),y=t.getFullYear();return t.getMonth()>=6?new Date(y,6,1):new Date(y,0,1);}
function nextCheckpoint(){var c=lastCheckpoint();return c.getMonth()?new Date(c.getFullYear()+1,0,1):new Date(c.getFullYear(),6,1);}
function isDue(){var a=new Date(String(META.at||'2000-01-01').replace(/\./g,'-')+'T00:00:00');return !(a>=lastCheckpoint());}

/* ---------- 관리자: 계산기 기준값 고치기 (?admin=1, 포털 관리자만) ---------- */
var ADM=/[?&]admin=1/.test(location.search),ED=null;
function pub(){try{return window.parent!==window&&parent.KIFPUB?parent.KIFPUB:null;}catch(e){return null;}}
function isAdmin(){var k=pub();try{return !!(k&&k.admin());}catch(e){return false;}}
function same(a,b){return JSON.stringify(a)===JSON.stringify(b);}
function chgMsg(){var n=admChanges();return n?'바뀐 칸 <b>'+n+'개</b> · 저장하면 모든 FC 화면에 반영됩니다.':'아직 바뀐 칸이 없습니다.';}
function admRender(){
  document.getElementById('app').classList.add('show-calc');
  var el=document.getElementById('calc');
  if(!isAdmin()){el.innerHTML='<div class="panel">관리자 계정으로 포털에 로그인한 뒤 「관리자 › 계산기 기준값」에서 열어 주세요.</div>';return;}
  if(!ED)ED={basis:META.basis,v:cp(P)};
  var h='<div class="adm"><div class="chd"><h2>계산기 기준값</h2><span class="cg">관리자</span></div>'+
    '<p class="desc">세율·공제 한도·기준금액을 여기서 고쳐 저장하면 모든 FC의 금융계산기에 반영됩니다. 법이 바뀌지 않았어도 1월·7월에 한 번씩 확인하고 「바뀐 것 없음 · 확인만」을 눌러 주세요.</p>'+
    (isDue()?'<div class="due"><b>점검 시기입니다.</b> 마지막 확인이 '+esc(atStr())+'입니다. '+dstr(lastCheckpoint())+' 이후 바뀐 세법·요율이 있는지 확인해 주세요.</div>'
        :'<div class="ok">마지막 확인: <b>'+esc(atStr())+'</b>'+(META.by?' ('+esc(META.by)+')':'')+' · 다음 점검: '+dstr(nextCheckpoint())+'</div>')+
    '<div class="panel grp"><h3>기준 이름</h3><div class="meta"><div class="f"><label for="a_basis">FC 화면에 보이는 기준 이름</label><div class="iw"><input id="a_basis" data-meta="basis" style="text-align:left" value="'+esc(ED.basis)+'"></div><div class="hl">예) 2027년 세법 (2027.1.1 개정 반영)</div></div></div></div>';
  RULES.forEach(function(g){
    var sc=g.items.filter(function(it){return it[2]!=='t';}),tb=g.items.filter(function(it){return it[2]==='t';});
    h+='<div class="panel grp"><h3>'+esc(g.g)+'</h3>';
    tb.forEach(function(it){var k=it[0],T=ED.v[k];
      h+='<div class="tl">'+esc(it[1])+'</div><table class="ed"><thead><tr><th>'+esc((it[4]||'구간 상한 · 값').split(' · ')[0])+'</th><th>'+esc((it[4]||'구간 상한 · 값').split(' · ')[1]||'값')+'</th><th></th></tr></thead><tbody>'+
        T.map(function(r,i){var o=P[k][i]||[];return '<tr><td><input data-t="'+k+'" data-i="'+i+'" data-c="0" inputmode="decimal" value="'+(r[0]==null?'':com2(r[0]))+'" placeholder="마지막 구간 (상한 없음)" class="'+(o[0]!==r[0]?'chg':'')+'"></td>'+
          '<td><input data-t="'+k+'" data-i="'+i+'" data-c="1" inputmode="decimal" value="'+r[1]+'" class="'+(o[1]!==r[1]?'chg':'')+'"></td><td><button type="button" data-rm="'+k+'" data-i="'+i+'" aria-label="구간 지우기">✕</button></td></tr>';}).join('')+
        '</tbody></table><button class="btn gh" type="button" data-addrow="'+k+'" style="padding:4px 10px;font-size:13px;margin-bottom:6px">+ 구간 더하기</button>';});
    if(sc.length)h+='<div class="sc" style="margin-top:10px">'+sc.map(function(it){var k=it[0],x=ED.v[k],chg=x!==P[k];
      return '<div class="f'+(chg?' chg':'')+'"><label for="a_'+k+'">'+esc(it[1])+'</label><div class="iw"><input id="a_'+k+'" data-s="'+k+'" inputmode="decimal" value="'+com2(x)+'"><span class="u">'+esc(it[2])+'</span></div>'+
        '<div class="was">'+(chg?'지금 '+com2(P[k])+it[2]+' → 바꿀 값':(it[2]==='만원'?man(x):''))+'</div></div>';}).join('')+'</div>';
    h+='</div>';});
  h+='<div class="bar2"><span class="msg" id="admMsg">'+chgMsg()+'</span>'+
    '<button class="btn gh" type="button" data-adm="reset">처음 값(2026.10 기준)으로</button><button class="btn gh" type="button" data-adm="undo">고친 것 취소</button>'+
    '<button class="btn gh" type="button" data-adm="check">바뀐 것 없음 · 확인만</button><button class="btn" type="button" data-adm="save">저장 (모든 FC에 반영)</button></div></div>';
  el.innerHTML=h;}
function admChanges(){var n=0;for(var k in P0)if(!same(ED.v[k],P[k]))n++;if(ED.basis!==META.basis)n++;return n;}
function admMsg(t){var m=document.getElementById('admMsg');if(m)m.innerHTML=t;}
function admCheck(){for(var k in ED.v){var T=ED.v[k];if(!Array.isArray(T))continue;
    if(!T.length)return '표에 구간이 하나도 없습니다.';
    for(var i=0;i<T.length;i++){var last=i===T.length-1;
      if(!last&&!(T[i][0]>0))return '표의 '+(i+1)+'번째 구간 상한을 넣어 주세요 (마지막 구간만 비울 수 있습니다).';
      if(last&&T[i][0]!=null)return '표의 마지막 구간은 상한을 비워 두어야 합니다 (그 이상 전부).';
      if(i>0&&!last&&T[i][0]<=T[i-1][0])return '표의 구간 상한은 위에서 아래로 커져야 합니다.';}}
  return '';}
async function admSave(onlyCheck){var k=pub();if(!k)return;
  var bad=onlyCheck?'':admCheck();if(bad){admMsg('<b style="color:var(--bad)">'+esc(bad)+'</b>');return;}
  var src=onlyCheck?P:ED.v,v={};for(var x in P0)if(!same(src[x],P0[x]))v[x]=cp(src[x]);
  var who='';try{who=(parent.document.getElementById('who')||{}).textContent||'';}catch(e){}
  var o={at:new Date(Date.now()+9*3600000).toISOString().slice(0,10),basis:onlyCheck?META.basis:(ED.basis||META.basis),by:who.replace(/^.*·\s*/,'').trim(),v:v};
  admMsg('저장하는 중… 잠시만 기다려 주세요.');
  try{await k.calcRules(o);setRules(o);ED=null;admRender();admMsg('<b>저장했습니다.</b> 모든 FC 화면의 금융계산기에 반영됩니다 (FC가 새로고침하면 보임).');toast('저장했습니다');}
  catch(e){admMsg('<b style="color:var(--bad)">저장하지 못했습니다:</b> '+esc(e&&e.message||e));}}
if(ADM){
  var CE=document.getElementById('calc');
  CE.addEventListener('input',function(e){if(!ED)return;var t=e.target,k;
    if((k=t.getAttribute('data-s'))){var raw=t.value.replace(/,/g,''),x=parseFloat(raw);ED.v[k]=isFinite(x)?x:P[k];}
    else if((k=t.getAttribute('data-t'))){var i=+t.getAttribute('data-i'),c=+t.getAttribute('data-c'),r2=t.value.replace(/,/g,''),y=parseFloat(r2);ED.v[k][i][c]=(c===0&&r2==='')?null:(isFinite(y)?y:0);}
    else if(t.getAttribute('data-meta')==='basis')ED.basis=t.value;
    admMsg(chgMsg());});
  CE.addEventListener('change',function(e){if(e.target.getAttribute('data-s')||e.target.getAttribute('data-t')){var y=window.scrollY;admRender();window.scrollTo(0,y);}});
  CE.addEventListener('click',function(e){var b=e.target.closest('button');if(!b||!ED)return;var k,y=window.scrollY;
    if((k=b.getAttribute('data-rm'))){if(ED.v[k].length>1){ED.v[k].splice(+b.getAttribute('data-i'),1);ED.v[k][ED.v[k].length-1][0]=null;}admRender();window.scrollTo(0,y);}
    else if((k=b.getAttribute('data-addrow'))){var T=ED.v[k],last=T[T.length-1],prev=T.length>1?T[T.length-2][0]:0;T.splice(T.length-1,0,[prev?prev*2:1000,last[1]]);admRender();window.scrollTo(0,y);}
    else if((k=b.getAttribute('data-adm'))){
      if(k==='reset'){ED={basis:ED.basis,v:cp(P0)};admRender();admMsg('처음 값으로 바꿨습니다. 「저장」을 눌러야 반영됩니다. '+chgMsg());}
      else if(k==='undo'){ED=null;admRender();}
      else if(k==='check')admSave(true);else if(k==='save')admSave(false);}});
}

/* ---------- 시작: 관리자가 저장한 기준값(content.json calcRules)을 읽어 덮어쓴다 ---------- */
function start(){var fb=document.getElementById('footBasis');if(fb)fb.textContent=basisText();if(ADM){admRender();return;}if(cur)openCalc(cur.id,false);else{renderList();var m0=/c=([\w]+)/.exec(location.hash);if(m0)openCalc(m0[1],false);}}
start();
fetch('../content.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(c){
  if(c&&c.calcRules){setRules(c.calcRules);ED=null;start();}}).catch(function(){});
window.KIFCALC={list:C,rules:function(){return {meta:META,v:P};},due:isDue};
})();
</script>
