/* ===== 로그인 (좌: 브랜드 / 우: 접속코드) ===== */
#gate{position:fixed;inset:0;z-index:100;display:grid;grid-template-columns:1fr 1fr;background:#eef1f6}
html[data-theme="dark"] #gate{background:#0a1429}
#gate .l{background:#0f2240;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:60px 62px 48px}
#gate .l::after{content:"";position:absolute;right:-220px;bottom:-200px;width:620px;height:620px;border-radius:50%;
  border:42px solid rgba(255,255,255,.035);pointer-events:none}
#gate .eyebrow{font-size:12px;font-weight:700;letter-spacing:.28em;color:#cb9c3a;display:flex;align-items:center;gap:12px}
#gate .eyebrow::before{content:"";width:26px;border-top:1px solid #cb9c3a}
#gate .logo{width:min(430px,100%);display:block;margin-bottom:34px}
#gate .l h2{font-size:25px;font-weight:700;margin-bottom:14px}
#gate .l p{margin:0;color:#b8c4d8;font-size:14px;line-height:1.85}
#gate .tools{font-size:11.5px;color:#8c9bb3;display:flex;flex-wrap:wrap;gap:8px 18px}
#gate .r{display:grid;place-items:center;padding:30px}
#gate .box{width:100%;max-width:390px}
#gate .box h1{font-size:24px;margin-bottom:6px}
#gate .box .sub{color:var(--muted);font-size:13.5px;margin:0 0 26px}
#gate label.f{display:block;font-size:12.5px;font-weight:700;margin-bottom:7px}
#gate input[type=password]{width:100%;padding:14px;border:1px solid var(--line-strong);border-radius:3px;background:var(--surface);
  color:var(--ink);font-size:17px;text-align:center;letter-spacing:.3em;font-family:inherit}
#gate input[type=password]:focus{outline:2px solid #cb9c3a;outline-offset:0}
#gate .keep{display:flex;align-items:center;gap:8px;margin:14px 0;font-size:13px;color:var(--ink)}
#gate .keep input{width:16px;height:16px;accent-color:#0f2240}
#gate .go{width:100%;padding:14px;border:0;border-radius:3px;background:#0f2240;color:#fff;font-size:14.5px;font-weight:700}
#gate .go:hover{background:#1d3557}
html[data-theme="dark"] #gate .go{background:#cb9c3a;color:#0f2240}
#gate .err{color:#b3261e;font-size:12.5px;margin-top:10px;min-height:18px}

#gate .guide span{display:block;color:var(--muted);margin-top:3px}
#gate .legal{margin-top:20px;color:var(--muted);font-size:11.5px;line-height:1.7}

  #gate .logo{width:230px;margin-bottom:0}
  #gate .l h2,#gate .l p,#gate .tools,#gate .eyebrow{display:none}

/* ===== 홈 ===== */
#home{display:none;max-width:1000px;margin:0 auto;padding:30px 24px 70px}
.ph{margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid var(--line-strong)}
.ph .kicker{font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--gold);margin-bottom:6px}
.ph h1{font-size:23px;border-left:4px solid #cb9c3a;padding-left:12px}

.foot{margin-top:26px;color:var(--muted);font-size:11.5px;line-height:1.75;border-top:1px solid var(--line);padding-top:14px}

/* ===== 이번 달의 원픽 ===== */

(function(){
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ── 표 렌더링 ── */
  var MEDAL='<svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="6.5" fill="#cb9c3a"/><path d="M8.6 9.2l2.4 2.4 4.2-4.6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 14.5L6.5 21l5.5-2.6 5.5 2.6L16 14.5" fill="#e0b862"/></svg>';
  function txt(s){
    var p=String(s).split('\n'), o=esc(p[0]);
    for(var i=1;i<p.length;i++){ o+= /^\(/.test(p[i]) ? '<small>'+esc(p[i])+'</small>' : '<br>'+esc(p[i]); }
    return o;
  }
  function table(c){
    var n=c.cols.length, anyG=c.rows.some(function(r){return r.g;}), cs=c.rows.some(function(r){return r.mf||r.hd;})?' colspan="2"':'';
    var o='<div class="tw"><table class="op"><thead><tr><th'+(anyG?' colspan="2"':'')+'>구분</th>';
    c.cols.forEach(function(k,i){o+='<th'+cs+' class="'+(i===c.best?'best':'')+'">'+(i===c.best?MEDAL:'')+esc(k.co)+'</th>';});
    o+='</tr></thead><tbody>';
    o+='<tr><td class="lab"'+(anyG?' colspan="2"':'')+'>상품명</td>';
    c.cols.forEach(function(k,i){o+='<td'+cs+' class="'+(i===c.best?'best':'')+'">'+esc(k.prod)+'</td>';});
    o+='</tr>';
    var rows=c.rows, curHasL=false;
    for(var r=0;r<rows.length;r++){
      var row=rows[r], tr='<tr'+(row.feat?' class="feat"':'')+'>';
      if(row.g){
        if(r===0||rows[r-1].g!==row.g){
          var span=1;while(r+span<rows.length&&rows[r+span].g===row.g)span++;
          var hasL=false;for(var q=r;q<r+span;q++)if(rows[q].l)hasL=true;
          curHasL=hasL;
          tr+='<td class="lab" rowspan="'+span+'"'+(hasL?'':' colspan="2"')+'>'+txt(row.g)+'</td>';
        }
        if(curHasL)tr+='<td class="sub">'+txt(row.l||'')+'</td>';
      }else{
        tr+='<td class="lab"'+(anyG?' colspan="2"':'')+'>'+txt(row.l)+'</td>';
      }
      for(var i=0;i<n;i++){
        var b=(i===c.best?' best':'');
        if(row.hd){tr+='<td class="hd'+b+'" colspan="1">'+esc(row.hd[0])+'</td><td class="hd'+b+'">'+esc(row.hd[1])+'</td>';}
        else if(row.mf){
          for(var s=0;s<2;s++){var lo=row.lo&&row.lo[s]===i?' lo':'';tr+='<td class="'+(b+lo).trim()+'">'+txt(row.mf[i][s])+'</td>';}
        }else{
          var v=row.v[i], cls=b.trim();
          if(String(v).indexOf('|')>-1){var kv=String(v).split('|');tr+='<td'+cs+' class="kv'+b+'"><div><span>'+esc(kv[0])+'</span><b>'+esc(kv[1])+'</b></div></td>';continue;}
          if(row.sum)cls+=' sum';
          tr+='<td'+cs+' class="'+cls.trim()+'">'+txt(v)+'</td>';
        }
      }
      o+=tr+'</tr>';
    }
    return o+'</tbody></table></div>';
  }
  /* hd 행/mf 행은 colspan 처리를 위해 v 행만 colspan=2 — 표 안에 남/여 구분이 없으면 colspan 제거 */
  function fixSpans(html,c){
    var hasMf=c.rows.some(function(r){return r.mf||r.hd;});
    return hasMf?html:html.replace(/<td colspan="2" class="/g,'<td class="').replace(/<td colspan="2">/g,'<td>');
  }

  function byId(id){for(var i=0;i<CATS.length;i++)if(CATS[i].id===id)return CATS[i];return null;}

      o+='</div>';

    o+=disc();

  }

  }
  function detail(c){
    var idx=CATS.indexOf(c), prev=CATS[idx-1], next=CATS[idx+1];
    var o='<button class="back" data-id="">← 원픽 전체</button>'+
      '<div class="ph"><div class="row"><div><div class="kicker">'+(c.kind==='best'?'베스트 초이스':'가성비 상품')+' · 2026.10</div><h1>'+esc(c.name)+'</h1></div>'+
      '<span class="badge'+(c.type==='life'?'':' g')+'">'+TYPES[c.type]+'</span></div>'+
      (c.lead?'<p>'+esc(c.lead)+'</p>':'')+'</div>';
    var hasBest=c.best>=0;
    o+='<div class="sec-t">'+(hasBest?'이번 달 선정 상품':'가성비 추천 상품')+' <i>'+c.cols.length+'개</i></div><div class="picks">';
    c.cols.forEach(function(k,i){o+='<div class="pk'+(i===c.best?' best':'')+'"><div class="rk">'+(i===c.best?'이번 달 원픽':(hasBest?'비교 상품 '+i:'추천 '+(i+1)))+'</div><b>'+esc(k.co)+'</b><span>'+esc(k.prod)+'</span></div>';});
    o+='</div>';
    o+='<div class="sec-t">타사 비교표'+(hasBest?' <i>'+esc(c.cols[c.best].co)+' – '+esc(c.cols[c.best].prod)+'</i>':'')+'</div>';
    if(c.cond)o+='<div class="cond">'+esc(c.cond)+'</div>';
    o+=table(c);
    if(c.reason){
      var r=c.reason;
      o+='<div class="sec-t">선정 이유 <i>'+esc(c.cols[c.best].co)+' – '+esc(c.cols[c.best].prod)+'</i></div>';
      o+=rs('상품 특징',r.feat,'')+rs('선정 이유',r.why,' why')+rs('세일즈 포인트',r.sales,'');
    }
    o+='<div class="src">원본: 26년 10월 베스트 픽업 상품 비교 분석 가이드 '+esc(c.src)+'쪽</div>';
    o+='<div class="pager"><button data-id="'+(prev?prev.id:'')+'"'+(prev?'':' style="visibility:hidden"')+'>← '+(prev?esc(prev.name):'')+'</button><button data-id="'+(next?next.id:'')+'"'+(next?'':' style="visibility:hidden"')+'>'+(next?esc(next.name):'')+' →</button></div>';
    o+=disc();
    return o;
  }
  function rs(k,list,cls){
    var l='<ul>';list.forEach(function(t){l+='<li>'+esc(t)+'</li>';});l+='</ul>';
    return '<div class="rs'+cls+'"><div class="k">'+k+'</div><div class="v">'+l+'</div></div>';
  }


  function show(){
    var id=(location.hash||'').replace('#','');
